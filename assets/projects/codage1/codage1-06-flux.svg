<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Schéma du flux automatisé de dépôt audio</title>
  <desc id="desc">Parcours utilisateur de la plateforme, de la connexion à la confirmation d'envoi Dropbox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a88ff"/>
      <stop offset="100%" stop-color="#5f6df6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a33"/>
      <stop offset="100%" stop-color="#ff580f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#253a8f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5f6df6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="980" fill="url(#bg)"/>

  <text x="900" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="46" font-weight="700" fill="#1f2b3d">
    Flux automatisé de dépôt de stems
  </text>
  <text x="900" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="25" fill="#4b5565">
    De la validation utilisateur au classement Dropbox
  </text>

  <g filter="url(#shadow)">
    <rect x="120" y="190" width="300" height="180" rx="26" fill="#ffffff" stroke="#d6def7" stroke-width="2"/>
    <rect x="468" y="190" width="300" height="180" rx="26" fill="#ffffff" stroke="#d6def7" stroke-width="2"/>
    <rect x="816" y="190" width="300" height="180" rx="26" fill="#ffffff" stroke="#d6def7" stroke-width="2"/>
    <rect x="1164" y="190" width="300" height="180" rx="26" fill="#ffffff" stroke="#d6def7" stroke-width="2"/>
    <rect x="1512" y="190" width="220" height="180" rx="26" fill="#ffffff" stroke="#d6def7" stroke-width="2"/>
  </g>

  <line x1="420" y1="280" x2="468" y2="280" stroke="url(#line)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="768" y1="280" x2="816" y2="280" stroke="url(#line)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1116" y1="280" x2="1164" y2="280" stroke="url(#line)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1464" y1="280" x2="1512" y2="280" stroke="url(#line)" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="150" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2b3d">1. Accès sécurisé</text>
  <text x="150" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">Mot de passe par groupe</text>
  <text x="150" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">(artiste / production)</text>

  <text x="498" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2b3d">2. Charte obligatoire</text>
  <text x="498" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">Lecture des sections</text>
  <text x="498" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">+ validation requise</text>

  <text x="846" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2b3d">3. Formulaire + Upload</text>
  <text x="846" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">Champs techniques</text>
  <text x="846" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">fichiers jusqu'à 3 Go</text>

  <text x="1194" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2b3d">4. Traitement</text>
  <text x="1194" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">Contrôles, nommage,</text>
  <text x="1194" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">archive ZIP</text>

  <text x="1542" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2b3d">5. Dropbox</text>
  <text x="1542" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">Envoi ciblé +</text>
  <text x="1542" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#4b5565">confirmation</text>

  <g filter="url(#shadow)">
    <rect x="250" y="470" width="1300" height="330" rx="34" fill="#ffffff" stroke="#d6def7" stroke-width="2"/>
    <rect x="286" y="510" width="1230" height="115" rx="26" fill="#f5f8ff" stroke="#dbe4ff" stroke-width="2"/>
    <rect x="286" y="650" width="1230" height="112" rx="26" fill="url(#accent)" opacity="0.12" stroke="#ff9b69" stroke-width="2"/>
  </g>

  <text x="320" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="700" fill="#1f2b3d">Routage intelligent Dropbox</text>
  <text x="320" y="598" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="24" fill="#4b5565">
    Mapping groupe → namespace partagé → dossier cible
  </text>

  <text x="320" y="696" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="700" fill="#9a3f16">Résultat</text>
  <text x="320" y="739" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="24" fill="#4b5565">
    Processus manuel supprimé, erreurs réduites et temps de traitement divisé par 4
  </text>
</svg>
